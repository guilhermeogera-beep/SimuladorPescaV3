<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SimPesca — Testes / ajustes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050a0f">
<style>
:root{--bg:#050a0f;--card:#0d151d;--border:#1a2736;--accent:#00d4ff;--green:#00e676;--text:#e0e6ed;--dim:#7b8d9e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px;}
h1{font-size:1.25rem;color:var(--accent);font-weight:800;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:9px;}
.sub{color:var(--dim);font-size:0.82rem;margin-bottom:18px;line-height:1.5;}
.grupo{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.grupo-tit{font-size:0.66rem;letter-spacing:1.5px;color:#7e96ad;text-transform:uppercase;margin-bottom:10px;}
label.linha{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:0.95rem;border-bottom:1px solid rgba(255,255,255,0.03);}
label.linha:last-child{border-bottom:none;}
input[type=checkbox]{accent-color:var(--accent);cursor:pointer;width:19px;height:19px;flex-shrink:0;}
.dica{font-size:0.72rem;color:var(--dim);margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<script>window.MENU_ATUAL='testes';</script>
<script src="menu.js"></script>
<div class="wrap">
  <h1><span>🧪</span> Testes / ajustes</h1>
  <div class="sub">Recursos de teste e ajuste que aparecem na tela do jogo. Salva no aparelho.</div>

  <div class="grupo">
    <div class="grupo-tit">🧪 Na tela do jogo</div>
    <label class="linha"><input type="checkbox" id="cfgTeste"> Botões de teste (sem hardware)</label>
    <label class="linha"><input type="checkbox" id="cfgSync"> Ajuste de sincronia (⏱)</label>
    <label class="linha"><input type="checkbox" id="cfgCarretel"> Linha no carretel / trava (📍)</label>
    <div class="dica">Úteis pra calibrar/testar. Em modo apresentação, pode deixar tudo desligado.</div>
  </div>
</div>

<script>
const g=(k,d)=>{ const v=localStorage.getItem(k); return v===null?d:v==='1'; };
function bindCheck(id, chave, padrao){ const el=document.getElementById(id); if(!el) return; el.checked=g(chave, padrao); el.addEventListener('change',()=>{ localStorage.setItem(chave, el.checked?'1':'0'); }); }
bindCheck('cfgTeste','simpesca2_mostrar_teste',true);
bindCheck('cfgSync','simpesca2_hud_sync',true);
bindCheck('cfgCarretel','simpesca2_hud_carretel',true);
</script>
</body>
</html>
